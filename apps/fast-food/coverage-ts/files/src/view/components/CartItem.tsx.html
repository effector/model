    <div style="margin-top:3em" class="ui container"><h1 class="ui header"><a href="../../../../index.html">TypeScript coverage report</a></h1><table style="margin-top:2em" class="ui celled table"><thead class=""><tr class=""><th class="">Filename</th><th class="">Percent</th><th class="">Threshold</th><th class="">Total</th><th class="">Covered</th><th class="">Uncovered</th></tr></thead><tbody class=""><tr class="positive"><td class="">src/view/components/CartItem.tsx</td><td class="">100.00%</td><td class="">80%</td><td class="">219</td><td class="">219</td><td class="">0</td></tr></tbody></table><textarea id="editor" readonly="" style="margin-top:3em">import { useMemo } from &#x27;react&#x27;;
import { useUnit } from &#x27;effector-react&#x27;;
import { EventCallable } from &#x27;effector&#x27;;
import {
  PlusIcon,
  MinusIcon,
  ArrowPathIcon,
  TrashIcon,
} from &#x27;@heroicons/react/24/outline&#x27;;
import { useLens } from &#x27;../hooks&#x27;;
import { Match, ProductViewMode } from &#x27;./ProductView&#x27;;
import { useApp } from &#x27;../AppContext&#x27;;
import { ProductInstance } from &#x27;../../models/cart&#x27;;

export const CartItem = ({
  id,
  model,
}: {
  id: string;
  model?: {
    getItem: (id: string) =&gt; ProductInstance;
    remove: EventCallable&lt;string&gt;;
  };
}) =&gt; {
  const { cartModel, events, appInstance } = useApp();
  const activeModel = (model || cartModel) as unknown as {
    getItem: (id: string) =&gt; ProductInstance;
    remove: EventCallable&lt;string&gt;;
  };

  const item = useMemo(() =&gt; activeModel.getItem(id), [id, activeModel]);
  const isDeleted = useLens(item.facets.product.$isDeleted, false);
  const name = useLens(item.facets.product.$name, &#x27;Loading...&#x27;);
  const price = useLens(item.facets.product.$price, 0);
  const quantity = useLens(item.facets.product.$quantity, 1);

  const units = useUnit({
    restore: item.facets.product.restore,
    increment: item.facets.product.increment,
    decrement: item.facets.product.decrement,
    remove: activeModel.remove,
  });

  const { restore, increment, decrement, remove } = units as {
    restore: () =&gt; void;
    increment: () =&gt; void;
    decrement: () =&gt; void;
    remove: (id: string) =&gt; void;
  };

  const openEdit = useUnit(events.editItem);
  const screen = useUnit(appInstance.input.$screen);
  const isCheckout = (screen as any) === &#x27;congrats&#x27;;

  const cases: Record&lt;
    string,
    React.ComponentType&lt;{ item: ProductInstance; mode: ProductViewMode }&gt;
  &gt; = {
    pizza: () =&gt; null,
    drink: () =&gt; null,
    coffee: () =&gt; null,
    cocktail: () =&gt; null,
    sauce: () =&gt; null,
    burger: () =&gt; null,
    twister: () =&gt; null,
    bucket: () =&gt; null,
    snack: () =&gt; null,
  };

  return (
    &lt;div className=&quot;p-4 flex flex-col border-b border-gray-100 last:border-0 transition-all bg-white&quot;&gt;
      &lt;div
        className={`flex gap-4 transition-all ${isDeleted ? &#x27;opacity-50 grayscale&#x27; : &#x27;opacity-100&#x27;}`}
      &gt;
        {/* Product Image */}
        &lt;div className=&quot;w-20 h-20 flex-shrink-0&quot;&gt;
          &lt;img
            src={`https://picsum.photos/seed/${name}/200/200`}
            alt={name}
            className=&quot;w-full h-full object-contain rounded-lg&quot;
          /&gt;
        &lt;/div&gt;

        {/* Product Info */}
        &lt;div className=&quot;flex-1 min-w-0&quot;&gt;
          &lt;div className=&quot;font-bold text-lg leading-tight mb-0.5 truncate&quot;&gt;
            {name}
          &lt;/div&gt;
          &lt;div className=&quot;text-xs text-gray-500 leading-tight&quot;&gt;
            &lt;Match model={item} cases={cases} mode=&quot;cart&quot; /&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      {/* Footer: Price, Edit, Quantity */}
      &lt;div className=&quot;flex justify-between items-center mt-4&quot;&gt;
        &lt;div
          className={`transition-all ${isDeleted ? &#x27;opacity-50 grayscale&#x27; : &#x27;opacity-100&#x27;}`}
        &gt;
          &lt;div className=&quot;bg-gray-100 text-[var(--theme-color,#ff6900)] px-4 py-2 rounded-2xl font-bold text-base&quot;&gt;
            {price * quantity} ₽
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div className=&quot;flex items-center gap-4&quot;&gt;
          {isDeleted ? (
            &lt;div className=&quot;flex items-center gap-2&quot;&gt;
              &lt;button
                className=&quot;px-4 py-2 rounded-xl bg-green-50 text-green-600 font-bold text-sm active:scale-95 transition-all border border-green-100 shadow-sm&quot;
                onClick={() =&gt; restore()}
              &gt;
                Вернуть
              &lt;/button&gt;
              &lt;button
                className=&quot;px-4 py-2 rounded-xl bg-red-50 text-red-500 font-bold text-sm active:scale-95 transition-all border border-red-100 shadow-sm&quot;
                onClick={() =&gt; remove(id)}
              &gt;
                Удалить
              &lt;/button&gt;
            &lt;/div&gt;
          ) : (
            &lt;&gt;
              {!isCheckout &amp;&amp; (
                &lt;button
                  className=&quot;text-[var(--theme-color,#ff6900)] font-bold text-sm hover:opacity-80 active:scale-95 transition-all&quot;
                  onClick={() =&gt; openEdit(id)}
                &gt;
                  Изменить
                &lt;/button&gt;
              )}

              &lt;div className=&quot;flex items-center gap-3 bg-gray-100 px-3 py-1.5 rounded-2xl&quot;&gt;
                &lt;button
                  className=&quot;p-0.5 text-gray-600 hover:text-gray-900 active:scale-90 transition-all disabled:opacity-30 disabled:pointer-events-none&quot;
                  onClick={() =&gt; decrement()}
                  disabled={isCheckout}
                &gt;
                  &lt;MinusIcon className=&quot;w-4 h-4&quot; strokeWidth={2.5} /&gt;
                &lt;/button&gt;
                &lt;span className=&quot;min-w-[1rem] text-center font-bold text-sm text-gray-900&quot;&gt;
                  {quantity}
                &lt;/span&gt;
                &lt;button
                  className=&quot;p-1 text-gray-600 hover:text-gray-900 active:scale-90 transition-all disabled:opacity-30 disabled:pointer-events-none&quot;
                  onClick={() =&gt; increment()}
                  disabled={isCheckout}
                &gt;
                  &lt;PlusIcon className=&quot;w-4 h-4&quot; strokeWidth={2.5} /&gt;
                &lt;/button&gt;
              &lt;/div&gt;
            &lt;/&gt;
          )}
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  );
};
