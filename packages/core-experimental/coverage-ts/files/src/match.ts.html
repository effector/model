  return (
    !!source &amp;&amp;
    typeof source === &#x27;object&#x27; &amp;&amp;
    &#x27;_sourceEvent&#x27; in source &amp;&amp;
    &#x27;_instances&#x27; in source &amp;&amp;
    &#x27;_activeVariants&#x27; in source &amp;&amp;
    &#x27;_state&#x27; in source &amp;&amp;
