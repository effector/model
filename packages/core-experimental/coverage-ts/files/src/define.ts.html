export type StoreDef&lt;T&gt; = {
  type: &#x27;store&#x27;;
  initial?: T;
  __type?: T;
};

export type EventDef&lt;T&gt; = {
  type: &#x27;event&#x27;;
  __type?: T;
};

export type ArrayDef&lt;T&gt; = {
  type: &#x27;array&#x27;;
  item: unknown;
  __type?: T[];
};

export type RefDef = {
  type: &#x27;ref&#x27;;
  kind: &#x27;self&#x27; | &#x27;tag&#x27;;
  name?: string;
};
export const define = {
  store: &lt;T extends unknown&gt;(initial?: T): StoreDef&lt;T&gt; =&gt; ({
    type: &#x27;store&#x27;,
    initial,
  }),
  event: &lt;T extends unknown&gt;(): EventDef&lt;T&gt; =&gt; ({
    type: &#x27;event&#x27;,
  }),
  array: &lt;T extends unknown&gt;(item: unknown): ArrayDef&lt;T&gt; =&gt; ({
    type: &#x27;array&#x27;,
    item,
  }),
};

export const ref = {
  self: { type: &#x27;ref&#x27;, kind: &#x27;self&#x27; } as const,
  tag: (name: string): RefDef =&gt; ({ type: &#x27;ref&#x27;, kind: &#x27;tag&#x27;, name }),
};

export function isRef(value: unknown): value is RefDef {
  return (
    !!value &amp;&amp;
    typeof value === &#x27;object&#x27; &amp;&amp;
    &#x27;type&#x27; in value &amp;&amp;
    (value as { type: unknown }).type === &#x27;ref&#x27;
  );
}
